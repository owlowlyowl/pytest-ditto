name: Publish to PyPI

# One tag releases core and every plugin at the same version. The artifacts are
# built and verified once, and exactly those files are published.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  artifacts:
    name: Artifacts
    uses: ./.github/workflows/release-artifacts.yml
    with:
      version: ${{ github.event.release.tag_name }}

  test:
    name: Test (${{ matrix.environment }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { environment: py312, task: test }
          - { environment: pandas-py312, task: verify-pandas }
          - { environment: pickle-py312, task: verify-pickle }
          - { environment: polars-py312, task: verify-polars }
          - { environment: pyarrow-py312, task: verify-pyarrow }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
          environments: ${{ matrix.environment }}
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run ${{ matrix.task }}
        run: pixi run -e ${{ matrix.environment }} ${{ matrix.task }}

  publish:
    name: Publish
    needs: [artifacts, test]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Download the verified artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Plugins require this core version, so core goes first. Uploads aren't atomic
      # across projects; skip-existing makes a partly published release safe to
      # re-run.
      - name: Publish pytest-ditto
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/pytest-ditto/
          skip-existing: true

      - name: Collect the plugins
        run: |
          mkdir plugins-dist
          mv dist/pytest-ditto-*/* plugins-dist/
          ls plugins-dist

      - name: Publish the plugins
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: plugins-dist/
          skip-existing: true
