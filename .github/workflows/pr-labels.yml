name: PR labels

run-name: "[Labels] ${{ github.event.pull_request.title }}"

# Every PR needs a `kind:` label, which sorts it into a section of the generated
# release notes (.github/release.yml). PRs labelled `release: skip` are exempt.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

# No concurrency group: "Kind label" is a required check, and a cancelled run of
# it (a PR opened with several labels starts one run per label) can leave the
# merge box waiting for it even after a later run passed. Each run is a few
# seconds, so they run side by side instead.

jobs:
  kind-label:
    name: Kind label
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read
    steps:
      # Labels are read from the API rather than the event, so a run started by
      # an earlier event still sees the labels the PR has now and can't fail
      # after a later run passed. They're never interpolated into the script.
      - name: Require a kind label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          labels=$(gh pr view "$PR_URL" --json labels --jq '.labels[].name')
          if grep -qx 'release: skip' <<< "$labels"; then
            echo "Labelled 'release: skip'; no kind label needed."
            exit 0
          fi
          kinds=$(grep '^kind: ' <<< "$labels" || true)
          if [ -z "$kinds" ]; then
            echo "::error::Add a kind: label (feature, enhancement, bug or chore). It sorts this PR into the release notes; see .github/release.yml."
            exit 1
          fi
          echo "Kind: ${kinds//$'\n'/, }"
