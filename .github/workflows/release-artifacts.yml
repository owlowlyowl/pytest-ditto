name: Release artifacts

# Builds and verifies the sdist and wheel of core and every plugin, and uploads
# them as the `dist` artifact: one directory per package, dist/<distribution>/.
# Called by CI, the pre-release test and the release, so all three build the same
# way.

on:
  workflow_call:
    inputs:
      version:
        description: Fail unless every package is at this version, e.g. the release tag.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-26.04
    steps:
      # Full history and tags: every package's version comes from `git describe`.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.81.0
          cache: true
          environments: build
          cache-write: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build every package
        run: pixi run -e build build

      - name: Verify the artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: pixi run -e build verify-artifacts ${VERSION:+--version "$VERSION"}

      - name: Upload the artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
