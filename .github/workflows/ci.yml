name: Test

run-name: "[Test] ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.0
          cache: true
          environments: lint

      - name: Run ruff
        run: pixi run -e lint ruff-lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.0
          cache: true
          environments: lint

      - name: Run basedpyright
        run: pixi run -e lint typecheck

  test:
    name: Test (Python 3.${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["12", "13", "14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.0
          cache: true
          environments: py3${{ matrix.python-version }}

      - name: Run tests (Python 3.${{ matrix.python-version }})
        run: pixi run -e py3${{ matrix.python-version }} test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py3${{ matrix.python-version }}
          path: .pytest/test-results.xml
          retention-days: 30

  portable-json:
    name: Strict JSON (${{ matrix.os }}, Python 3.${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["12", "13", "14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.0
          cache: true
          environments: py3${{ matrix.python-version }}

      - name: Run strict JSON and plugin discovery tests
        run: >-
          pixi run -e py3${{ matrix.python-version }} pytest
          tests/ci/test_recorders.py
          tests/ci/test_recorder_properties.py
          tests/ci/test_plugins.py

  lock-file:
    name: Lock-file drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.0
          cache: true
          environments: py312

      - name: Verify committed snapshots match ditto.lock
        run: pixi run -e py312 verify

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.0
          cache: true
          environments: py312

      - name: Run branch coverage
        run: pixi run -e py312 test-cov

  artifacts:
    name: Release artifact boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.77.0
          cache: true
          environments: build

      - name: Build sdist and wheel
        run: pixi run -e build build

      - name: Verify exact release artifacts
        run: pixi run -e build verify-artifacts
