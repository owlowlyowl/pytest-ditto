name: Pre-release Testing

# The release workflow's build, verification and tests, without publishing.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  artifacts:
    name: Artifacts
    uses: ./.github/workflows/release-artifacts.yml

  test:
    name: Test (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { environment: py312, task: test }
          - { environment: pandas-py312, task: verify-pandas }
          - { environment: pickle-py312, task: verify-pickle }
          - { environment: pyarrow-py312, task: verify-pyarrow }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          cache: true
          environments: ${{ matrix.environment }}

      - name: Run ${{ matrix.task }}
        run: pixi run -e ${{ matrix.environment }} ${{ matrix.task }}
