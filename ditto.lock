          "recorder": "json"
        },
        {
          "nodeid": "tests/ci/test_usage_examples.py::test_roundtrips_parametrised_ints_through_json[First]",
          "key": "b",
          "recorder": "json"
        },
        {
          "nodeid": "tests/ci/test_usage_examples.py::test_roundtrips_parametrised_ints_through_json[Second]",
          "key": "a",
          "recorder": "json"
        },
        {
          "nodeid": "tests/ci/test_usage_examples.py::test_roundtrips_parametrised_ints_through_json[Second]",
          "key": "b",
          "recorder": "json"
        },
        {
          "nodeid": "tests/ci/test_usage_examples.py::test_roundtrips_string_through_json_format",
