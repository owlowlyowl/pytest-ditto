site_name: pytest-ditto
site_description: Snapshot regression testing for dataframe transformations in pytest, with minimal ceremony, pluggable recorders, and local or remote storage backends.
site_url: https://owlowlyowl.github.io/pytest-ditto/
repo_url: https://github.com/owlowlyowl/pytest-ditto
repo_name: owlowlyowl/pytest-ditto

docs_dir: src

extra_css:
  - stylesheets/text-diagrams.css

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Concepts:
    - How Snapshots Work: concepts/snapshots.md
    - Snapshot Names: concepts/naming.md
    - The Lock File: concepts/lock-file.md
  - Guides:
    - Recorders: guides/recorders.md
    - Storage Backends: guides/backends.md
    - Running in CI: guides/ci.md
    - Maintaining Snapshots: guides/maintaining.md
    - Writing a Recorder: guides/custom-recorders.md
    - Writing a Backend: guides/custom-backends.md
  - Plugins:
    - pandas: plugins/pandas.md
    - polars: plugins/polars.md
    - PyArrow: plugins/pyarrow.md
    - pickle: plugins/pickle.md
  - Upgrading to 2.0: upgrading.md
  - Reference:
    - Configuration: reference/configuration.md
    - CLI:
      - Overview: cli/index.md
      - ditto run: cli/run.md
      - ditto update: cli/update.md
      - ditto prune: cli/prune.md
      - ditto verify: cli/verify.md
      - ditto lock: cli/lock.md
      - ditto list: cli/list.md
      - ditto status: cli/status.md
      - ditto clean: cli/clean.md
      - ditto recorders: cli/recorders.md
      - ditto doctor: cli/doctor.md
      - ditto lint: cli/lint.md
      - ditto stats: cli/stats.md
    - Python API:
      - Overview: reference/index.md
      - ditto: reference/ditto.md
      - ditto.recorders: reference/recorders.md
      - ditto.backends: reference/backends.md
      - ditto.exceptions: reference/exceptions.md
  - Project:
    - Release notes: https://github.com/owlowlyowl/pytest-ditto/releases
    - Contributing: https://github.com/owlowlyowl/pytest-ditto/blob/main/DEVELOPMENT.md
    - Security policy: https://github.com/owlowlyowl/pytest-ditto/blob/main/SECURITY.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            members_order: source
            show_if_no_docstring: false
            filters: public

markdown_extensions:
  - mkdocs-click
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
