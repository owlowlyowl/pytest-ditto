[project]
name = "pytest-ditto"
dynamic = [
    "version",
]
description = "Snapshot testing pytest plugin with minimal ceremony and flexible recorders."
keywords = ["pytest" , "testing"]
authors = [{ name = "Lachlan Taylor", email = "95459213+owlowlyowl@users.noreply.github.com" }]
maintainers = [{ name = "Lachlan Taylor", email = "95459213+owlowlyowl@users.noreply.github.com" }]
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pytest>=8.3",
    "pyyaml",
    "rich",
    "click",
    "fsspec",
    "msgspec>=0.18",
]
[project.optional-dependencies]
pandas = ["pytest-ditto-pandas"]
polars = ["pytest-ditto-polars"]
pyarrow = ["pytest-ditto-pyarrow"]
dev = [
    "pre-commit",
    "hatch>=1.9.4",
    "hatch-vcs>=0.4.0",
]

[project.scripts]
ditto = "ditto.cli:cli"

[project.entry-points.pytest11]
ditto = "ditto.plugin"

[project.entry-points.ditto_recorders]
yaml   = "ditto.recorders._yaml:yaml"
json   = "ditto.recorders._json:json"


[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


[tool.hatch.build]
hooks.vcs.version-file = "src/ditto/_version.py"
hooks.vcs.template = "__version__ = {version!r}"
targets.wheel.packages = ["src/ditto"]
targets.wheel.strict-naming = false
targets.sdist.only-include = ["src", "version_builder.py", "SECURITY.md"]
targets.sdist.strict-naming = false

[tool.hatch.version]
source = "code"
path = "version_builder.py"
expression = "_version()"


[tool.hatch.envs.default]
python = "3.12"
dependencies = [
  "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests/ci}"

[[tool.hatch.envs.all.matrix]]
python = ["3.12", "3.13", "3.14"]


[tool.pytest.ini_options]
minversion = "8.3"
testpaths = "tests/ci"
addopts = [
  "-lv",
  "--tb=short",
  "--color=yes",
  "--code-highlight=yes",
  "--junit-xml=.pytest/test-results.xml",
]
junit_family = "xunit2"
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]


[tool.coverage.run]
branch = true
source = ["src/ditto"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
preview = true
src = ["src/ditto"]
line-length = 88
target-version = "py312"
exclude = ["src/ditto/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "PERF", "W"]
ignore = ["F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "plugins/pandas/src", "plugins/pickle/src", "plugins/polars/src", "plugins/pyarrow/src"]
venvPath = ".pixi/envs"
venv = "lint"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
pytest-ditto = { path = ".", editable = true }

[tool.pixi.feature.lint.dependencies]
# Audits the GitHub Actions workflows and Dependabot config (.github/zizmor.yml).
zizmor = ">=1.30"
pre-commit = ">=4.0.1,<5"
ruff = ">=0.8.4,<1"
# For type-checking plugins/*/src.
pandas = "*"
polars = ">=1.0"
pyarrow = ">=16.1.0"

[tool.pixi.feature.lint.pypi-dependencies]
basedpyright = ">=1.29"

[tool.pixi.feature.lint.tasks]
lint = "pre-commit run --all"
typecheck = "pre-commit run basedpyright --all-files"
ruff-lint = "pre-commit run ruff-check --all-files"
workflow-lint = "pre-commit run zizmor --all-files"

[tool.pixi.feature.test.dependencies]
pytest = ">=8.3,<9"
pytest-cov = ">=6.0,<7"
pytest-xdist = ">=3.6"
hypothesis = ">=6.0"

[tool.pixi.feature.test.pypi-dependencies]
fakeredis = ">=2.0"

[tool.pixi.feature.examples.pypi-dependencies]
duckdb = ">=1.2"
redis = ">=5.0"
psycopg2-binary = ">=2.9"
pytest-ditto-pandas = { path = "plugins/pandas", editable = true }

[tool.pixi.feature.examples.tasks]
examples-local = "pytest examples/local -q"
examples-duckdb = "pytest examples/duckdb -q"
examples-duckdb-reset = "rm -f examples/duckdb/.example-snapshots.duckdb examples/duckdb/.example-snapshots.duckdb.wal"
examples-postgres-up = "docker container ls --filter name=^/pytest-ditto-examples-postgres$ --filter status=running --quiet | rg -q . || docker start pytest-ditto-examples-postgres || docker run -d --name pytest-ditto-examples-postgres -p 5433:5432 -e POSTGRES_DB=ditto_examples -e POSTGRES_USER=ditto -e POSTGRES_PASSWORD=ditto -v pytest-ditto-examples-postgres:/var/lib/postgresql/data postgres:16-alpine"
examples-postgres = "pytest examples/postgres -q"
examples-postgres-down = "docker stop pytest-ditto-examples-postgres"
examples-postgres-reset = "docker rm -f pytest-ditto-examples-postgres >/dev/null 2>&1 || true && docker volume rm -f pytest-ditto-examples-postgres >/dev/null 2>&1 || true"
examples-redis-up = "docker container ls --filter name=^/pytest-ditto-examples-redis$ --filter status=running --quiet | rg -q . || docker start pytest-ditto-examples-redis || docker run -d --name pytest-ditto-examples-redis -p 6380:6379 -v pytest-ditto-examples-redis:/data redis:7-alpine redis-server --appendonly yes --save 60 1"
examples-redis = { cmd = "pytest examples/redis -q", env = { DITTO_REDIS_TARGET = "redis://localhost:6380/0" } }
examples-redis-down = "docker stop pytest-ditto-examples-redis"
examples-redis-reset = "docker rm -f pytest-ditto-examples-redis >/dev/null 2>&1 || true && docker volume rm -f pytest-ditto-examples-redis >/dev/null 2>&1 || true"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py312.tasks]
test = "pytest"
test-cov = "pytest --cov=ditto --cov-branch --cov-report=html --cov-report=term --cov-report=xml"
verify = "ditto verify tests/ci/test_usage_examples.py"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.py313.tasks]
test = "pytest"
test-cov = "pytest --cov=ditto --cov-branch --cov-report=html --cov-report=term --cov-report=xml"
verify = "ditto verify tests/ci/test_usage_examples.py"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.feature.py314.tasks]
test = "pytest"
test-cov = "pytest --cov=ditto --cov-branch --cov-report=html --cov-report=term --cov-report=xml"
verify = "ditto verify tests/ci/test_usage_examples.py"

[tool.pixi.feature.build.dependencies]
uv = ">=0.5"
# verify_release_artifacts.py compares versions and requirements with it.
packaging = ">=24"

[tool.pixi.feature.build.tasks]
# Core and every plugin, one directory each: dist/<distribution name>/.
build = "python scripts/build_release_artifacts.py dist"
verify-artifacts = "python scripts/verify_release_artifacts.py dist"

# First-party plugins are installed from plugins/<name> as editable path
# dependencies, never through the pytest-ditto[<name>] extra, which would resolve
# against PyPI. Each plugin's suite runs from its own directory, as a third-party
# plugin's would.
[tool.pixi.feature.pandas.pypi-dependencies]
pytest-ditto-pandas = { path = "plugins/pandas", editable = true }

[tool.pixi.feature.pandas.tasks]
test-pandas = { cmd = "pytest", cwd = "plugins/pandas" }
verify-pandas = { cmd = "ditto verify", cwd = "plugins/pandas" }

# pandas depends on pyarrow for parquet, so it needs the same libstdc++ preload.
[tool.pixi.feature.pandas.target.linux-64.dependencies]
libstdcxx-ng = ">=14"

[tool.pixi.feature.pandas.target.linux-64.tasks]
test-pandas = { cmd = "pytest", cwd = "plugins/pandas", env = { LD_PRELOAD = "$CONDA_PREFIX/lib/libstdc++.so.6" } }
verify-pandas = { cmd = "ditto verify", cwd = "plugins/pandas", env = { LD_PRELOAD = "$CONDA_PREFIX/lib/libstdc++.so.6" } }

[tool.pixi.feature.pickle.pypi-dependencies]
pytest-ditto-pickle = { path = "plugins/pickle", editable = true }

[tool.pixi.feature.pickle.tasks]
test-pickle = { cmd = "pytest", cwd = "plugins/pickle" }
verify-pickle = { cmd = "ditto verify", cwd = "plugins/pickle" }

[tool.pixi.feature.pyarrow.pypi-dependencies]
pytest-ditto-pyarrow = { path = "plugins/pyarrow", editable = true }

[tool.pixi.feature.pyarrow.tasks]
test-pyarrow = { cmd = "pytest", cwd = "plugins/pyarrow" }
verify-pyarrow = { cmd = "ditto verify", cwd = "plugins/pyarrow" }

[tool.pixi.feature.pyarrow.target.linux-64.dependencies]
# pyarrow's C++ dependencies require a newer libstdc++ than the system provides on
# Ubuntu 22.04 / glibc 2.35 — pin libstdcxx-ng >= 14 and preload it at runtime.
# libstdcxx-ng is a Linux-only package; macOS and Windows use the system runtime.
libstdcxx-ng = ">=14"

[tool.pixi.feature.pyarrow.target.linux-64.tasks]
test-pyarrow = { cmd = "pytest", cwd = "plugins/pyarrow", env = { LD_PRELOAD = "$CONDA_PREFIX/lib/libstdc++.so.6" } }
verify-pyarrow = { cmd = "ditto verify", cwd = "plugins/pyarrow", env = { LD_PRELOAD = "$CONDA_PREFIX/lib/libstdc++.so.6" } }

[tool.pixi.feature.polars.pypi-dependencies]
pytest-ditto-polars = { path = "plugins/polars", editable = true }

[tool.pixi.feature.polars.tasks]
test-polars = { cmd = "pytest", cwd = "plugins/polars" }
verify-polars = { cmd = "ditto verify", cwd = "plugins/polars" }

[tool.pixi.feature.polars.target.linux-64.dependencies]
# Polars wheels need a newer libstdc++ than the system provides on Ubuntu 22.04
# / glibc 2.35 — pin libstdcxx-ng >= 14 and preload it at runtime, same as pyarrow.
libstdcxx-ng = ">=14"

[tool.pixi.feature.polars.target.linux-64.tasks]
test-polars = { cmd = "pytest", cwd = "plugins/polars", env = { LD_PRELOAD = "$CONDA_PREFIX/lib/libstdc++.so.6" } }
verify-polars = { cmd = "ditto verify", cwd = "plugins/polars", env = { LD_PRELOAD = "$CONDA_PREFIX/lib/libstdc++.so.6" } }

[tool.pixi.feature.docs.pypi-dependencies]
zensical = ">=0.0.43"
mkdocstrings-python = ">=1.0"

[tool.pixi.feature.docs.tasks]
docs-serve = { cmd = "zensical serve", cwd = "docs" }
docs-build = { cmd = "zensical build", cwd = "docs" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
examples = { features = ["examples", "py312", "test"], solve-group = "default" }
pandas-py312 = { features = ["pandas", "py312", "test"] }
pandas-py313 = { features = ["pandas", "py313", "test"] }
pandas-py314 = { features = ["pandas", "py314", "test"] }
pickle-py312 = { features = ["pickle", "py312", "test"] }
pickle-py313 = { features = ["pickle", "py313", "test"] }
pickle-py314 = { features = ["pickle", "py314", "test"] }
polars-py312 = { features = ["polars", "py312", "test"] }
polars-py313 = { features = ["polars", "py313", "test"] }
polars-py314 = { features = ["polars", "py314", "test"] }
pyarrow-py312 = { features = ["pyarrow", "py312", "test"] }
pyarrow-py313 = { features = ["pyarrow", "py313", "test"] }
pyarrow-py314 = { features = ["pyarrow", "py314", "test"] }
lint = { features = ["lint", "py312"] }
py312 = { features = ["py312", "test"] }
py313 = { features = ["py313", "test"] }
py314 = { features = ["py314", "test"] }
build = { features = ["build"] }
docs = { features = ["docs"] }

[tool.pixi.tasks]
