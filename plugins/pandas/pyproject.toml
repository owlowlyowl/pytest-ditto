[project]
name = "pytest-ditto-pandas"
dynamic = ["version", "dependencies"]
description = "pytest-ditto plugin for pandas DataFrame and Series snapshots."
keywords = ["pytest", "testing", "pandas", "snapshot"]
authors = [{ name = "Lachlan Taylor", email = "95459213+owlowlyowl@users.noreply.github.com" }]
maintainers = [{ name = "Lachlan Taylor", email = "95459213+owlowlyowl@users.noreply.github.com" }]
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/owlowlyowl/pytest-ditto"
Source = "https://github.com/owlowlyowl/pytest-ditto/tree/main/plugins/pandas"

[project.entry-points.ditto_recorders]
"pandas.parquet" = "ditto_pandas.recorders:parquet"
"pandas.json" = "ditto_pandas.recorders:json"
"pandas.csv" = "ditto_pandas.recorders:csv"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build]
targets.wheel.packages = ["src/ditto_pandas"]
targets.sdist.only-include = ["src", "README.md", "LICENSE", "hatch_build.py"]

# hatch_build.py adds pytest-ditto>=<this version>,<3 to these.
[tool.hatch.metadata.hooks.custom]
# The floors are what CI's pandas-floor-py312 environment tests.
dependencies = [
    "pandas>=2.2",
    # pandas reads and writes parquet through pyarrow.
    "pyarrow>=16.1.0",
]

# Versioned in lockstep with pytest-ditto, from the same git tag.
[tool.hatch.version]
source = "code"
path = "../../version_builder.py"
expression = "_version()"


[tool.pytest.ini_options]
minversion = "8.3"
testpaths = "tests/ci"
addopts = [
  "-lv",
  "--tb=short",
  "--color=yes",
  "--code-highlight=yes",
  "--junit-xml=.pytest/test-results.xml",
]
junit_family = "xunit2"
filterwarnings = [
    "ignore::DeprecationWarning",
]
