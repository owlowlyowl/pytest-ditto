[project]
name = "pytest-ditto-pickle"
dynamic = ["version", "dependencies"]
description = "pytest-ditto plugin for pickle snapshots."
keywords = ["pytest", "testing", "pickle", "snapshot"]
authors = [{ name = "Lachlan Taylor", email = "95459213+owlowlyowl@users.noreply.github.com" }]
maintainers = [{ name = "Lachlan Taylor", email = "95459213+owlowlyowl@users.noreply.github.com" }]
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/owlowlyowl/pytest-ditto"
Source = "https://github.com/owlowlyowl/pytest-ditto/tree/main/plugins/pickle"

[project.entry-points.ditto_recorders]
# Named `pickle` (mark `ditto.pickle`) but persisted with identifier `pkl`,
# the extension pytest-ditto 1.x used, so 1.x .pkl files load unchanged.
pickle = "ditto_pickle.recorders:pickle"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build]
targets.wheel.packages = ["src/ditto_pickle"]
targets.sdist.only-include = ["src", "README.md", "LICENSE", "hatch_build.py"]

# hatch_build.py adds pytest-ditto>=<this version>,<3 to these.
[tool.hatch.metadata.hooks.custom]
dependencies = []

# Versioned in lockstep with pytest-ditto, from the same git tag.
[tool.hatch.version]
source = "code"
path = "../../version_builder.py"
expression = "_version()"


[tool.pytest.ini_options]
minversion = "8.3"
testpaths = "tests/ci"
addopts = [
  "-lv",
  "--tb=short",
  "--color=yes",
  "--code-highlight=yes",
  "--junit-xml=.pytest/test-results.xml",
]
junit_family = "xunit2"
filterwarnings = [
    "ignore::DeprecationWarning",
]
